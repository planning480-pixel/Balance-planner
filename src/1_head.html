<!DOCTYPE html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALANCE Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: fixed navy rail on the left, light working canvas on the right, AI drawer slides in from the right. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F3F5F9;
  --sidebar: #F8F9FB;
  --line: #E4E8EE;
  --line-strong: #CBD2DD;
  --fg: #0C1A35;
  --muted: #52637F;
  --accent: #1A5BD6;
  --accent-hover: #144AB3;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5EDFC;
    --ok: #157A3C;
  --ok-soft: #E3F4E9;
  --warn: #A55309;
  --warn-soft: #FCEFDD;
  --bad: #BF2339;
  --bad-soft: #FBE5E8;
  --risk-1: #D7F2E0;
  --risk-1-ink: #146C38;
  --risk-2-ink: #7A5A00;
  --risk-3-ink: #9A4A06;
  --risk-4-ink: #A61B33;
  --risk-2: #FBEFB8;
  --risk-3: #FBD3A8;
  --risk-4: #F6B3B9;
  --ba: #1D9152;
  --la: #2360E0;
  --n: #0B7088;
  --c: #7238E0;
  --e: #D02A55;
  --paper: #FFFFFF;
  --ink: #0C1A35;
  --ink-muted: #4F5F7A;
  --paper-line: #D6DFEC;
  --paper-soft: #EFF4FC;
  --paper-accent: #1A5BD6;
  --scrim: rgba(8, 18, 40, .45);
  --shadow: 0 1px 2px rgba(12, 26, 53, .06), 0 8px 24px rgba(12, 26, 53, .06);
  --shadow-pop: 0 12px 40px rgba(12, 26, 53, .18);
  --font-display: "Anuphan", "IBM Plex Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", sans-serif;
  --font-body: "IBM Plex Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --nav-w: 268px;
  --nav-w-mini: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1222; --surface: #101B31; --surface-2: #15233F; --sidebar: #0D1729; --line: #22345A; --line-strong: #31477A;
    --fg: #E6ECF8; --muted: #9AAAC7; --accent: #6A9BFF; --accent-hover: #8AB1FF; --accent-ink: #081127; --accent-soft: #19305E;
    --ok: #5BD08A; --ok-soft: #133A26; --warn: #F3B04F; --warn-soft: #3B2A12; --bad: #FF7D8E; --bad-soft: #43161E;
    --risk-1: #1D4A30; --risk-2: #4C4417; --risk-3: #5A3516; --risk-4: #5C1F2A; --risk-1-ink: #8EE3AE; --risk-2-ink: #F3D57A; --risk-3-ink: #F8B57A; --risk-4-ink: #FF9AAA;
    --ba: #4CC985; --la: #77A3FF; --n: #3CC3D8; --c: #AE8BFF; --e: #FF7E9C;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-pop: 0 12px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1222; --surface: #101B31; --surface-2: #15233F; --sidebar: #0D1729; --line: #22345A; --line-strong: #31477A;
  --fg: #E6ECF8; --muted: #9AAAC7; --accent: #6A9BFF; --accent-hover: #8AB1FF; --accent-ink: #081127; --accent-soft: #19305E;
  --ok: #5BD08A; --ok-soft: #133A26; --warn: #F3B04F; --warn-soft: #3B2A12; --bad: #FF7D8E; --bad-soft: #43161E;
  --risk-1: #1D4A30; --risk-2: #4C4417; --risk-3: #5A3516; --risk-4: #5C1F2A; --risk-1-ink: #8EE3AE; --risk-2-ink: #F3D57A; --risk-3-ink: #F8B57A; --risk-4-ink: #FF9AAA;
  --ba: #4CC985; --la: #77A3FF; --n: #3CC3D8; --c: #AE8BFF; --e: #FF7E9C;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-pop: 0 12px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Pillar colour hooks */
[data-p="BA"] { --pc: var(--ba); } [data-p="LA"] { --pc: var(--la); } [data-p="N"] { --pc: var(--n); } [data-p="C"] { --pc: var(--c); } [data-p="E"] { --pc: var(--e); }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-weight: 500; transition: background .15s, border-color .15s, color .15s; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-danger { color: var(--bad); }
.btn-danger:hover { border-color: var(--bad); color: var(--bad); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--r-sm); border: 0; background: transparent; color: inherit; }
.icon-btn:hover { background: var(--surface-2); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-weight: 500; font-size: 14px; }
.req::after { content: " *"; color: var(--bad); }
.help { font-size: 13px; color: var(--muted); }
.input, .select, .textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--fg); }
.textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[readonly] { background: var(--surface-2); color: var(--muted); }
.field.invalid .input, .field.invalid .textarea, .field.invalid .select { border-color: var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip-accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip-ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip-warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip-bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip-p { background: color-mix(in srgb, var(--pc) 14%, transparent); color: var(--pc); border-color: transparent; }
.pcode { font-family: var(--font-display); font-weight: 700; color: var(--pc); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 40px; min-width: 52px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.toast-wrap { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: var(--r-sm); box-shadow: var(--shadow-pop); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .22s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: 0; } } }

/* ---------- Auth ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--surface); }
.auth-side { background: var(--accent-soft); padding-block: 40px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: 40px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.auth-brand { display: flex; gap: 12px; align-items: center; }
.auth-brand b { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.auth-hero { display: grid; gap: 14px; }
.auth-word { font-family: var(--font-display); font-weight: 700; font-size: clamp(56px, 7.4vw, 120px); line-height: .9; letter-spacing: -0.035em; display: flex; flex-wrap: nowrap; white-space: nowrap; margin: 0; }
.auth-word span:nth-child(1) { color: var(--ba); } .auth-word span:nth-child(2) { color: var(--la); } .auth-word span:nth-child(3) { color: var(--n); } .auth-word span:nth-child(4) { color: var(--c); } .auth-word span:nth-child(5) { color: var(--e); }
.auth-tag { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.auth-tag .muted { font-weight: 500; }
.auth-pillars { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.auth-pillars li { display: flex; align-items: center; gap: 10px; }
.auth-pillars li::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--pc); flex: none; }
.auth-main { display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth-card { width: min(100%, 420px); display: grid; gap: 20px; }
.auth-card h2 { font-size: 24px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--r-sm); }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 6px; background: transparent; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(12, 26, 53, .08); }
.form { display: grid; gap: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.linkish { background: none; border: 0; color: var(--accent); padding: 0; min-height: 0; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.proto-note { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: var(--r-sm); padding: 10px 12px; }
@media (max-width: 860px) {
  .auth { grid-template-columns: 1fr; }
  .auth-side { padding-block: 20px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 16px; }
  .auth-word { font-size: clamp(44px, 14vw, 64px); }
  .auth-pillars { display: none; }
  .row2 { grid-template-columns: 1fr; }
}

/* ---------- Shell ---------- */
.shell { height: 100%; display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); }
.shell.mini { grid-template-columns: var(--nav-w-mini) minmax(0, 1fr); }
.nav { background: var(--sidebar); color: var(--fg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 68px; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 28px; height: 28px; }
.brand-text { min-width: 0; display: grid; line-height: 1.25; }
.brand-sub { font-size: 13px; color: var(--muted); white-space: nowrap; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.wordmark .w-ba { color: var(--ba); } .wordmark .w-la { color: var(--la); } .wordmark .w-n { color: var(--n); } .wordmark .w-c { color: var(--c); } .wordmark .w-e { color: var(--e); }
.wordmark .w-p { color: var(--fg); font-weight: 600; }
.nav-list { list-style: none; margin: 0; padding: 6px 10px 12px; display: grid; gap: 2px; flex: 1; overflow-y: auto; align-content: start; }
.nav-sec { font-size: 12px; color: var(--muted); padding: 18px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); text-align: left; font-weight: 500; font-size: 14.5px; line-height: 1.3; }
.nav-item .ic { width: 18px; height: 18px; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.nav-item[aria-current="page"] .ic { color: var(--accent); }
.nav-item .badge { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }
.nav-foot { padding: 8px 10px 12px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.shell.mini .brand-text, .shell.mini .nav-label, .shell.mini .nav-sec, .shell.mini .nav-item .badge { display: none; }
.shell.mini .nav-item { justify-content: center; padding: 0; min-height: 44px; }
.shell.mini .brand { justify-content: center; padding: 14px 0; }
.main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scope { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.scope span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 10px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-family: var(--font-display); }
.who-t { display: grid; line-height: 1.2; font-size: 13px; }
.who-t span { color: var(--muted); font-size: 12px; }
.view { flex: 1; overflow-y: auto; padding-block: 28px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1440px; margin-inline: auto; display: grid; gap: 20px; }
.only-mobile { display: none; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 39; }
@media (min-width: 901px) { .view { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 900px) {
  .shell, .shell.mini { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(86vw, 300px); transform: translateX(-102%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); }
  .shell.open .nav { transform: none; box-shadow: var(--shadow-pop); }
  .shell.mini .brand-text, .shell.mini .nav-label, .shell.mini .nav-sec { display: initial; }
  .shell.mini .brand-text { display: grid; }
  .shell.mini .nav-item { justify-content: flex-start; padding: 6px 12px; }
  .only-mobile { display: inline-grid; }
  .only-desk { display: none !important; }
  .who-t { display: none; }
  .who { padding: 3px; }
}

/* ---------- Page heads ---------- */
.ph { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; justify-content: space-between; }
.ph-t { display: grid; gap: 2px; min-width: 0; }
.eyebrow { font-size: 14px; color: var(--muted); }
.ph h1 { font-size: 24px; font-weight: 600; }
.ph h2 { font-size: 20px; }
.ph .sub { font-size: 14px; color: var(--muted); }
.empty { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 24px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* ---------- Dashboard ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 14px; }
.filters .field { flex: 1 1 180px; }
.filters .select { min-height: 42px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 18px; display: grid; gap: 2px; align-content: start; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.stat .d { font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat .v { font-size: 24px; } }
.vision { background: var(--accent-soft); border-radius: var(--r); padding: 16px clamp(16px, 3vw, 32px); text-align: center; display: grid; gap: 2px; }
.vision .lab { font-size: 13px; font-weight: 600; color: var(--accent); }
.vision p { font-family: var(--font-display); font-weight: 600; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.5; max-width: 62ch; margin-inline: auto; }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 268px), 1fr)); gap: 14px; align-items: start; }
.pcard { border-top: 4px solid var(--pc); display: grid; min-width: 0; }
.pc-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pc-num { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--pc); color: var(--pc); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.pc-h h3 { font-size: 15px; flex: 1; }
.pc-id { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px; background: color-mix(in srgb, var(--pc) 7%, transparent); align-items: start; }
.pc-letter { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; color: var(--pc); grid-row: span 2; }
.pc-en { font-weight: 600; color: var(--pc); font-size: 14px; }
.pc-desc { font-size: 13px; color: var(--muted); }
.pc-sec { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.pc-sec h4 { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
.goal { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.45; }
.kpi-li { display: grid; grid-template-columns: 30px 1fr; gap: 2px 8px; font-size: 13.5px; }
.kpi-li .mono { color: var(--pc); font-size: 13px; padding-top: 1px; }
.kpi-meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.tgt { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12px; }
.st-li { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; font-size: 13.5px; align-items: start; }
.st-li .mono { color: var(--pc); font-weight: 600; }
.cnt { font-size: 12px; min-width: 26px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.cnt.on { background: color-mix(in srgb, var(--pc) 16%, transparent); color: var(--pc); font-weight: 600; }
.prj { display: grid; gap: 2px; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.prj:hover { border-color: var(--pc); }
.prj b { font-weight: 500; font-size: 14px; }
.prj span { font-size: 12px; color: var(--muted); }
.more { font-size: 13px; }

/* ---------- Journey ---------- */
.journey { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.journey li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.journey .jn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--muted); flex: none; }
.journey .jt { display: grid; min-width: 0; line-height: 1.25; }
.journey .jt b { font-weight: 600; font-size: 14px; }
.journey .jt span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.journey li.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.journey li.cur .jn { background: var(--accent); color: var(--accent-ink); }
.journey li.done .jn { background: var(--ok-soft); color: var(--ok); }
@media (max-width: 720px) { .journey .jt span { display: none; } .journey li { padding: 8px; gap: 6px; } .journey .jt b { font-size: 12px; } }

/* ---------- New plan ---------- */
.types { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.type { padding: 20px; display: grid; gap: 14px; align-content: start; }
.type-h { display: flex; gap: 14px; align-items: flex-start; }
.type-ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.type h3 { font-size: 19px; }
.type ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick button { display: grid; gap: 2px; text-align: left; padding: 12px 14px; min-height: 64px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); }
.pick button:hover { border-color: var(--accent); background: var(--accent-soft); }
.pick b { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.pick span { font-size: 13px; color: var(--muted); }
.quota { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.bar { height: 8px; flex: 1; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.plan { padding: 16px; display: grid; gap: 10px; border-left: 4px solid var(--pc, var(--line-strong)); }
.plan h4 { font-size: 16px; }
.plan .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.plan .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.plan .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; color: var(--muted); }
.plan .facts b { color: var(--fg); font-weight: 500; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--bad); }

/* ---------- Editor ---------- */
.ed { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.toc { position: sticky; top: 88px; display: grid; gap: 2px; }
.toc a { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-size: 14px; }
.toc a:hover { background: var(--surface-2); color: var(--fg); }
.toc .tk { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none; }
.toc .tk.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.toc .tk svg { width: 12px; height: 12px; stroke-width: 3; }
.secs { display: grid; gap: 16px; min-width: 0; }
.sec { padding: 20px; display: grid; gap: 16px; scroll-margin-top: 84px; }
.sec-h { display: flex; gap: 12px; align-items: center; }
.sec-h .type-ic { width: 40px; height: 40px; border-radius: 10px; }
.sec-h h3 { font-size: 17px; }
.sec-h p { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.pchips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pchips button { display: grid; gap: 0; justify-items: center; padding: 10px 4px; min-height: 64px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); }
.pchips button b { font-family: var(--font-display); font-size: 22px; color: var(--pc); line-height: 1.1; }
.pchips button span { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.25; }
.pchips button[aria-pressed="true"] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 12%, transparent); box-shadow: 0 0 0 1px var(--pc); }
@media (max-width: 560px) { .pchips button span { display: none; } }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--line-strong); }
.opt input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
.opt b { font-weight: 500; }
.opt .d { grid-column: 2; font-size: 13px; color: var(--muted); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chain { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.chain li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; position: relative; padding-bottom: 12px; }
.chain li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.chain .cd { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.chain .ct { display: grid; gap: 2px; padding-top: 3px; }
.chain .ct small { font-size: 12px; color: var(--muted); }
.chain .ct b { font-weight: 500; font-size: 14px; }
.auto-box { background: var(--surface-2); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 10px; }
.auto-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); font-weight: 600; }
.chal { display: grid; gap: 6px; }
.chal li { font-size: 14px; }
.money { position: relative; }
.money .input { padding-right: 48px; text-align: right; font-variant-numeric: tabular-nums; }
.money span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
.steps { display: grid; gap: 12px; }
.step { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.step-h { display: flex; gap: 10px; align-items: center; }
.step-h .sn { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.step-h .input { min-height: 40px; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; touch-action: none; user-select: none; -webkit-user-select: none; }
.months button { min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 11px; padding: 0; line-height: 1.1; color: var(--muted); }
.months button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.months-wrap { overflow-x: auto; }
.months-wrap .months { min-width: 520px; }
.rmap { display: grid; grid-template-columns: 28px repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, 46px) 28px; gap: 4px; max-width: 420px; }
.rmap .ax { display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.rmap button { border: 1px solid transparent; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--fg); }
.rmap .l1 { background: var(--risk-1); } .rmap .l2 { background: var(--risk-2); } .rmap .l3 { background: var(--risk-3); } .rmap .l4 { background: var(--risk-4); }
.rmap button[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: -3px; }
.rmap-wrap { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; }
.rmap-cap { display: grid; gap: 8px; font-size: 14px; }
@media (max-width: 640px) { .rmap-wrap { grid-template-columns: 1fr; } }
.ai-sug { border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 8px; font-size: 14px; white-space: pre-wrap; }
.ai-btn { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--surface); color: var(--accent); font-weight: 500; }
.ai-btn:hover { background: var(--accent-soft); }
.lbl-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.savebar { position: sticky; bottom: 0; z-index: 15; margin-top: 8px; padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); }
.savebar .status { flex: 1; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 160px; }
.miss { background: var(--bad-soft); color: var(--bad); border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; }
@media (max-width: 1100px) { .ed { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }

/* ---------- Report sheet (fixed paper look in both themes) ---------- */
.report-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sheet-wrap { overflow-x: auto; padding: 4px 0 16px; }
.sheet { width: 1123px; min-height: 794px; margin-inline: auto; background: var(--paper); color: var(--ink); box-shadow: var(--shadow-pop); font-family: var(--font-body); font-size: 11.5px; line-height: 1.45; display: flex; flex-direction: column; }
.sheet * { color: inherit; }
.sh-top { background: #0E2756; color: #fff; padding: 14px 28px 12px; display: grid; gap: 6px; }
.sh-top .ey { font-size: 10.5px; letter-spacing: .06em; color: #B9CCF5; display: flex; justify-content: space-between; gap: 12px; }
.sh-top h1 { font-family: var(--font-display); font-size: 20px; color: #fff; line-height: 1.3; }
.sh-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.sh-tags span { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; }
.sh-body { padding: 14px 28px 8px; display: grid; gap: 12px; flex: 1; align-content: start; }
.sh-cols { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 22px; align-items: start; }
.sh-col { display: grid; gap: 11px; align-content: start; min-width: 0; }
.sh-p { white-space: pre-wrap; }
.sh-m { color: var(--ink-muted); }
.sh-ul { margin: 0; padding-left: 16px; }
.sh-2c { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sh-facts { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--paper-line); border-radius: 8px; overflow: hidden; }
.sh-facts div { padding: 8px 10px; display: grid; gap: 1px; border-right: 1px solid var(--paper-line); }
.sh-facts div:last-child { border-right: 0; }
.sh-facts small { color: var(--ink-muted); font-size: 9.5px; }
.sh-facts b { font-weight: 600; font-size: 12px; }
.sh-h { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--paper-accent); display: flex; gap: 8px; align-items: center; border-bottom: 1.5px solid var(--paper-accent); padding-bottom: 3px; margin-bottom: 6px; }
.sh-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sh-kv { display: grid; grid-template-columns: 84px 1fr; gap: 3px 10px; }
.sh-kv dt { color: var(--ink-muted); }
.sh-kv dd { margin: 0; font-weight: 500; }
.sh-chain { display: grid; gap: 2px; }
.sh-chain div { display: grid; grid-template-columns: 116px 1fr; gap: 8px; }
.sh-chain small { color: var(--ink-muted); }
.gantt { width: 100%; border-collapse: collapse; table-layout: fixed; }
.gantt th, .gantt td { border: 1px solid var(--paper-line); padding: 2px 4px; font-size: 10px; text-align: center; }
.gantt th { background: var(--paper-soft); font-weight: 600; }
.gantt td.nm { text-align: left; font-size: 10.5px; }
.gantt td.on { background: #1A5BD6; }
.gantt col.c-nm { width: 30%; } .gantt col.c-w { width: 6%; }
.sh-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sh-box { border: 1px solid var(--paper-line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 3px; align-content: start; }
.sh-box small { color: var(--paper-accent); font-weight: 600; font-size: 10px; }
.sh-box p { white-space: pre-wrap; }
.sh-erm { display: grid; grid-template-columns: 1fr 140px; gap: 14px; }
.mini-map { display: grid; grid-template-columns: 12px repeat(5, 1fr); grid-template-rows: repeat(5, 22px) 12px; gap: 2px; font-size: 8px; color: var(--ink-muted); }
.mini-map i { border-radius: 3px; display: grid; place-items: center; font-style: normal; font-weight: 700; color: #0C1A35; font-size: 9px; }
.mini-map .m1 { background: #CFEFD9; } .mini-map .m2 { background: #FBEFB8; } .mini-map .m3 { background: #FBD3A8; } .mini-map .m4 { background: #F6B3B9; }
.mini-map .sel { outline: 2px solid #0C1A35; outline-offset: -2px; }
.mini-map span { display: grid; place-items: center; }
.sh-foot { padding: 6px 28px 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: end; font-size: 10.5px; color: var(--ink-muted); }
.sign { text-align: center; display: grid; gap: 2px; }
.sign .ln { border-bottom: 1px dotted var(--ink-muted); height: 20px; }
.sign b { color: var(--ink); font-weight: 500; }
.pill-p { display: inline-block; padding: 0 6px; border-radius: 4px; color: #fff; font-weight: 600; font-size: 10px; }

/* ---------- KPI + settings ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td .input, .tbl td .select, .tbl td .textarea { min-height: 38px; padding: 6px 10px; }
.tbl td .textarea { min-height: 60px; }
.grp-h td { background: color-mix(in srgb, var(--pc) 9%, var(--surface)); font-weight: 600; color: var(--pc); }
.stabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.stabs button { border: 0; background: none; padding: 10px 14px; min-height: 44px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.stabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.ro-note { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--warn); background: var(--warn-soft); border-radius: var(--r-sm); padding: 10px 12px; }
.tog { display: flex; flex-wrap: wrap; gap: 6px; }
.tog button { min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 12.5px; }
.tog button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.lvl { padding: 16px; display: grid; gap: 10px; }
.item-row { display: flex; gap: 8px; align-items: center; }

/* ---------- AI drawer ---------- */
.ai-panel { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(100vw, 440px); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; transform: translateX(104%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ai-panel.open { transform: none; }
.ai-h { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); }
.ai-h .type-ic { width: 38px; height: 38px; border-radius: 10px; }
.ai-h b { font-family: var(--font-display); font-weight: 600; flex: 1; }
.ai-body { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
.msg { padding: 10px 12px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; max-width: 92%; }
.msg.u { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; }
.msg.a { background: var(--surface-2); justify-self: start; border-bottom-left-radius: 4px; }
.msg.a.err { background: var(--bad-soft); color: var(--bad); }
.msg-tools { justify-self: start; display: flex; gap: 6px; margin-top: -6px; }
.msg-tools button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; color: var(--muted); }
.msg-tools button:hover { border-color: var(--accent); color: var(--accent); }
.msg-tools button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
#tts-auto[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); }
.quick button:hover { border-color: var(--accent); color: var(--accent); }
.ai-f { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
.ai-in { display: flex; gap: 8px; align-items: flex-end; }
.ai-in .textarea { min-height: 44px; max-height: 160px; }
.ai-note { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .ai-panel, .nav, .shell { transition: none; } }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; border-radius: 8px; min-height: 18px; }
@media (prefers-reduced-motion: no-preference) { .skel { animation: sh 1.4s linear infinite; } @keyframes sh { to { background-position: -200% 0; } } }

/* ---------- Monthly reporting ---------- */
.mpick { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.mpick button { flex: none; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; color: var(--muted); white-space: nowrap; }
.mpick button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }
.mpick button.now::after { content: " •"; color: var(--accent); }
.bar-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; }
.rep-list { display: grid; gap: 10px; }
.rep { padding: 14px 16px; display: grid; gap: 14px; }
.rep-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.rep-h .t { display: grid; gap: 2px; min-width: 0; }
.rep-h .t b { font-weight: 600; }
.rep-h .t span { font-size: 13px; color: var(--muted); }
.rep-h .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.prog { display: grid; gap: 4px; min-width: 150px; font-size: 12px; color: var(--muted); }
.pbar { position: relative; height: 8px; background: var(--surface-2); border-radius: 999px; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.pbar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); border-radius: 1px; }
.rep-form { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
